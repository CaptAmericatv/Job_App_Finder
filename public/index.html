<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job App Finder</title>
  <meta name="description" content="Find jobs at businesses near you, straight from their own websites.">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>Job App Finder</h1>
    <p class="tag">Openings from local businesses' own websites, checked automatically.</p>
  </header>

  <main class="layout">
    <section class="panel controls">
      <div class="home">
        <div>
          <div class="home-name">📍 <span id="homeName">Fort Payne, AL</span></div>
          <div class="hint" id="homeArea"></div>
        </div>
        <button id="scanBtn" type="button" class="btn ghost sm">Check now</button>
      </div>
      <div id="progress" class="progress" hidden><div id="bar"></div></div>
      <div id="status" class="hint" role="status">Loading saved jobs…</div>

      <label class="field">
        <span>Local minimum wage (optional)</span>
        <input id="floor" type="number" inputmode="decimal" min="0" step="0.25" placeholder="e.g. 7.25">
      </label>
      <label class="check"><input id="noWebsite" type="checkbox"> Show businesses with no website in Leads (to call or visit)</label>
    </section>

    <section class="panel mapwrap"><div id="map"></div>
      <div class="legend"><span class="dot g"></span>Jobs found <span class="dot o"></span>Hiring page <span class="dot s"></span>Nothing found</div>
    </section>

    <section class="panel results">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="jobs">Jobs <span id="nJobs">0</span></button>
        <button class="tab" data-tab="leads">Leads <span id="nLeads">0</span></button>
        <button class="tab" data-tab="saved">Saved <span id="nSaved">0</span></button>
      </div>
      <div class="filters row">
        <input id="keyword" type="search" placeholder="Filter: e.g. cook, part-time, driver" aria-label="Filter results">
        <select id="sort" aria-label="Sort">
          <option value="new">Newest</option>
          <option value="distance">Closest</option>
          <option value="pay">Highest pay</option>
          <option value="name">Business A–Z</option>
        </select>
      </div>
      <div class="row small">
        <label class="check"><input id="onlyListed" type="checkbox"> Only show listed pay (no estimates)</label>
        <label class="check"><input id="hideMaybe" type="checkbox"> Hide "maybe" items</label>
        <button id="csvBtn" type="button" class="btn ghost sm">Download CSV</button>
      </div>
      <div id="list" class="list"><p class="empty">Loading…</p></div>
    </section>
  </main>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
